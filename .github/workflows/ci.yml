# Contracts, SDK and website checks on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Format, build and test
        working-directory: contracts
        run: |
          forge --version
          forge fmt --check
          forge build --sizes
          forge test -vv
      - name: Base mainnet fork tests (real USDC)
        working-directory: contracts
        env:
          BASE_FORK_RPC: https://mainnet.base.org
        run: forge test --mc BaseMainnetForkTest -vv
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-out
          path: contracts/out
          retention-days: 1

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            integrations/mcp/package-lock.json
      # the tests reuse the SDK's mock x402 merchant
      - working-directory: sdk
        run: npm ci
      - working-directory: integrations/mcp
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  ai-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            integrations/ai-sdk/package-lock.json
      - working-directory: sdk
        run: npm ci
      - working-directory: integrations/ai-sdk
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  langchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            integrations/langchain/package-lock.json
      - working-directory: sdk
        run: npm ci
      - working-directory: integrations/langchain
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  turnkey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/turnkey/package-lock.json
      - working-directory: integrations/turnkey
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  pr-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/pr-guard/guard.test.mjs scripts/pr-guard/deps-audit.test.mjs

  zodiac-roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/zodiac-roles/package-lock.json
      # The Base-fork suite needs anvil and BASE_FORK_RPC; without them it is skipped and the unit tests run.
      - working-directory: integrations/zodiac-roles
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  order-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/order-guard/package-lock.json
      - working-directory: integrations/order-guard
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run demo

  sdk:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: contracts-out
          path: contracts/out
      # anvil enables the on-chain and official-x402 conformance tests; without it they are skipped.
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - working-directory: sdk
        run: |
          npm ci
          npm run typecheck
          npm test
          npm audit --omit=dev --audit-level=high

  airdrop-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: tools/airdrop
        run: |
          npm ci
          npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high
