# Contracts, SDK and website checks on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - name: Format, build and test
        working-directory: contracts
        run: |
          forge --version
          forge fmt --check
          forge build --sizes
          forge test -vv
      - name: Base mainnet fork tests (real USDC)
        working-directory: contracts
        env:
          BASE_FORK_RPC: https://mainnet.base.org
        run: forge test --mc BaseMainnetForkTest -vv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contracts-out
          path: contracts/out
          retention-days: 1

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            integrations/mcp/package-lock.json
      # the tests reuse the SDK's mock x402 merchant
      - working-directory: sdk
        run: npm ci
      - working-directory: integrations/mcp
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  ai-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            integrations/ai-sdk/package-lock.json
      - working-directory: sdk
        run: npm ci
      - working-directory: integrations/ai-sdk
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  langchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sdk/package-lock.json
            integrations/langchain/package-lock.json
      - working-directory: sdk
        run: npm ci
      - working-directory: integrations/langchain
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  turnkey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/turnkey/package-lock.json
      - working-directory: integrations/turnkey
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  pr-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test scripts/pr-guard/guard.test.mjs scripts/pr-guard/deps-audit.test.mjs

  newcomer:
    # Install the packages like a newcomer (packed tarballs + the documented install line, empty ESM project) and run
    # the docs' offline examples verbatim, strict typecheck included (#26). Offline: mock merchants, no keys, no chain.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install -g npm@11.6.2
      - name: Build the packages
        run: |
          for d in sdk integrations/ai-sdk integrations/langchain integrations/agentkit; do
            (cd "$d" && npm ci && npm run build)
          done
      - run: node scripts/newcomer/run.mjs
      # The complete agent workflow example (#40), installed from npm like a newcomer would: clone, npm i, npm test.
      - name: Example agent workflow
        working-directory: examples/agent-workflow
        run: |
          npm ci
          npm run typecheck
          npm test
          npm start

  privy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/privy/package-lock.json
      - run: npm install -g npm@11.6.2
      - working-directory: integrations/privy
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  cdp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/cdp/package-lock.json
      - run: npm install -g npm@11.6.2
      - working-directory: integrations/cdp
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  openfort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/openfort/package-lock.json
      - run: npm install -g npm@11.6.2
      - working-directory: integrations/openfort
        run: |
          npm ci --ignore-scripts # @openfort/openfort-node runs `npx only-allow pnpm` on preinstall
          npm run typecheck
          npm test
          npm run build

  agentkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/agentkit/package-lock.json
      # The lockfile is written by npm 11; npm 10's ci also wants ws's optional peers listed. Use the same npm.
      - run: npm install -g npm@11.6.2
      - working-directory: integrations/agentkit
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  zodiac-roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/zodiac-roles/package-lock.json
      # anvil + BASE_FORK_RPC run the Base mainnet fork suites (canonical Safe and Roles, real USDC, the official facilitator).
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - working-directory: integrations/zodiac-roles
        env:
          BASE_FORK_RPC: https://mainnet.base.org
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  order-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/order-guard/package-lock.json
      - working-directory: integrations/order-guard
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run demo

  sdk:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: contracts-out
          path: contracts/out
      # anvil enables the on-chain and official-x402 conformance tests; without it they are skipped.
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - working-directory: sdk
        run: |
          npm ci
          npm run typecheck
          npm test
          npm audit --omit=dev --audit-level=high

  airdrop-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - working-directory: tools/airdrop
        run: |
          npm ci
          npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high
