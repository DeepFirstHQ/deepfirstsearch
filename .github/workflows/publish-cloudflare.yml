# Publishes the Cloudflare Agents integration to npm when a tag like `cloudflare-v0.1.0` is pushed.
# The tag must match integrations/cloudflare/package.json.
# Auth: npm trusted publishing (OIDC, no stored secret) configured on npmjs.com for this repository and this file.
# Two jobs: `test` runs the tests without an OIDC token; only `publish` gets one, installs with scripts off, builds and publishes.
name: Publish Cloudflare integration

on:
  push:
    tags: ["cloudflare-v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tag matches package version
        working-directory: integrations/cloudflare
        run: test "cloudflare-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm install -g npm@11.6.2
      - working-directory: integrations/cloudflare
        run: |
          npm ci
          npm test
          npm run typecheck

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.6.2
      - working-directory: integrations/cloudflare
        run: |
          npm ci --ignore-scripts
          npm run build
          npm publish --provenance --access public --ignore-scripts
