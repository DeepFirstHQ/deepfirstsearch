# Watches the mainnet Agent Safe deployment every 6 hours. A failing run (an alert) emails the maintainers.
# Configure the repository variables MAINNET_FACTORY, MAINNET_FEE_JAR and MAINNET_FROM_BLOCK to enable it.
name: Monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    if: ${{ vars.MAINNET_FACTORY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - working-directory: sdk
        run: npm ci
      - working-directory: sdk
        env:
          RPC_URL: https://mainnet.base.org
          FACTORY: ${{ vars.MAINNET_FACTORY }}
          FEE_JAR: ${{ vars.MAINNET_FEE_JAR }}
          FROM_BLOCK: ${{ vars.MAINNET_FROM_BLOCK }}
          LOOKBACK_BLOCKS: "12000"
          LARGE_USDC: "100000000"
        run: npx tsx scripts/monitor.ts
