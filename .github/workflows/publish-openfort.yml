# Stages the Openfort integration on npm when a tag like `openfort-v0.1.1` is pushed. The tag must match integrations/openfort/package.json.
# Auth: npm trusted publishing (OIDC, no stored secret) configured on npmjs.com for this repository and this file, with
# direct publishing off: the version only goes live after the owner approves it on npmjs.com (or `npm stage approve <id>`).
# Two jobs: `test` installs dependencies and runs their code (tests) without an OIDC token; only `publish` gets one, and
# it only installs with install scripts off, builds and publishes.
name: Stage Openfort integration

on:
  push:
    tags: ["openfort-v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tag matches package version
        working-directory: integrations/openfort
        run: test "openfort-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm install -g npm@12.2.0 # `npm stage publish` needs npm 12
      - working-directory: integrations/openfort
        run: |
          npm ci --ignore-scripts # @openfort/openfort-node runs `npx only-allow pnpm` on preinstall
          npm test
          npm run typecheck

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12.2.0 # `npm stage publish` needs npm 12
      - working-directory: integrations/openfort
        run: |
          npm ci --ignore-scripts
          npm run build
          npm stage publish . --provenance --access public --ignore-scripts
