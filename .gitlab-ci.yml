# Free GitLab CI: contracts, SDK and website checks on every push.
# The website is hosted on Cloudflare Pages (connected to this repo), which serves web/public/_headers (ADR-010).

variables:
  GIT_SUBMODULE_STRATEGY: normal

stages: [test, build, release]

contracts:
  stage: test
  image:
    name: ghcr.io/foundry-rs/foundry:stable
    # The image's ENTRYPOINT is `/bin/sh -c`, which breaks GitLab's job script; clear it.
    entrypoint: [""]
  script:
    - cd contracts
    - forge --version
    - forge fmt --check
    - forge build --sizes
    - forge test -vv
  artifacts:
    paths: [contracts/out]
    expire_in: 1 day

sdk:
  stage: test
  image: node:22
  needs: [contracts]
  before_script:
    # anvil enables the on-chain and official-x402 conformance tests; without it they are skipped.
    - curl -sSL https://foundry.paradigm.xyz | bash
    - export PATH="$HOME/.foundry/bin:$PATH" && foundryup
  script:
    - export PATH="$HOME/.foundry/bin:$PATH"
    - cd sdk
    - npm ci
    - npm run typecheck
    - npm test
    - npm audit --omit=dev --audit-level=high

web:
  stage: build
  image: node:22
  script:
    - cd web
    - npm ci
    - npm run build
    - npm audit --omit=dev --audit-level=high
  artifacts:
    paths: [web/dist]
    expire_in: 1 week


# Publishes the SDK to npm when a tag like `sdk-v0.1.0` is pushed. The tag must match sdk/package.json.
# Auth: npm trusted publishing (OIDC, no stored secret), configured on npmjs.com for ntursi/deepfirstsearch and
# this file. Needs npm >= 11.5.1. Provenance is signed through Sigstore.
publish-sdk:
  stage: release
  image: node:22
  needs: [sdk]
  rules:
    - if: $CI_COMMIT_TAG =~ /^sdk-v\d+\.\d+\.\d+$/
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  script:
    - cd sdk
    - test "sdk-v$(node -p "require('./package.json').version")" = "$CI_COMMIT_TAG"
    - npm install -g npm@11.6.2
    - npm ci
    - npm run typecheck
    - npm run build
    - npm publish --provenance --access public --ignore-scripts
